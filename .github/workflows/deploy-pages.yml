# Публикация игры на GitHub Pages: https://telesik.github.io/<имя репозитория>/
# Деплой идёт напрямую из Actions-артефакта — ветка gh-pages не используется,
# собранные файлы в git не попадают.
#
# Схема версионирования (см. CLAUDE.md): main — текущий релиз, живёт
# в корне сайта; каждая ветка feature/* собирается в подкаталог
# /<имя репозитория>/<версия из app/package.json этой ветки>/ (фиче-версии вида
# 1.0.0-<feature>). Любой пуш в main или feature/* пересобирает сайт
# целиком: корень — из main, подкаталоги — из вершин всех feature-веток.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Один деплой за раз; новый пуш отменяет недоехавший предыдущий.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          # Общие модули — подмодуль commons/ (telesik-web-commons).
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Сайт живёт на подпути /<имя репозитория>/ (берётся из контекста Actions,
      # чтобы переименование репозитория ничего не ломало), поэтому base передаётся флагом
      # только здесь — локальные npm run dev/build не затронуты.
      - name: Build main (релиз, корень сайта)
        working-directory: app
        run: |
          npm ci
          npm run build -- --base=/${{ github.event.repository.name }}/
      - name: Assemble site root
        run: |
          mkdir -p _site
          cp -R app/dist/. _site/
      - name: Build feature branches (подкаталоги по фиче-версиям)
        run: |
          set -euo pipefail
          for ref in $(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/feature/*'); do
            echo "=== building $ref"
            wt="$(mktemp -d)"
            git worktree add --force "$wt" "$ref"
            # В новом рабочем дереве подмодули пусты — поднять (у веток без подмодулей команда ничего не делает).
            git -C "$wt" submodule update --init --recursive
            ver="$(node -p "require('$wt/app/package.json').version")"
            if [ -z "$ver" ] || [ "$ver" = "undefined" ]; then
              echo "у ветки $ref нет версии в app/package.json — пропуск"; git worktree remove --force "$wt"; continue
            fi
            (cd "$wt/app" && npm ci && npm run build -- --base=/${{ github.event.repository.name }}/"$ver"/)
            mkdir -p "_site/$ver"
            cp -R "$wt/app/dist/." "_site/$ver/"
            git worktree remove --force "$wt"
            echo "=== $ref → /${{ github.event.repository.name }}/$ver/"
          done
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5