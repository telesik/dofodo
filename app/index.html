<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Dofodo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23182a21'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle'%3E%F0%9F%8C%B3%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">
          <span class="brand-name">Dofodo</span>
          <span id="round-chip" class="round-chip"></span>
        </div>
        <div id="status" class="status">
          <div id="status-event" class="status-event"></div>
          <div id="status-prompt" class="status-prompt"></div>
        </div>
        <div class="topbar-right">
          <!-- Значки шапки — собственные рисунки, а не знаки юникода: редкие
               символы подставляются из разных запасных шрифтов, у каждого своя
               метрика, и ряд «пляшет» по вертикали — по-своему на каждой
               системе. Общий viewBox и одна толщина обводки держат ряд ровным. -->
          <!-- Зеркало — крайняя левая: решение «мне привычнее с другой стороны»
               приходит и посреди партии, а лезть за ним в настройки долго.
               Контурная фигура слева и залитая справа — это оригинал и его
               отражение; пунктир между ними — ось. -->
          <button id="btn-mirror" class="icon-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3.5v17" stroke-dasharray="2.6 2.6" />
              <path d="M9 7.4 4.2 12 9 16.6z" />
              <path d="M15 7.4 19.8 12 15 16.6z" fill="currentColor" stroke="none" />
            </svg>
          </button>
          <button id="btn-hist" class="icon-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1" />
              <path d="M3.2 4.4v4.2h4.2" />
              <path d="M12 7.6V12l3 1.8" />
            </svg>
          </button>
          <button id="btn-mark" class="icon-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5" />
              <path d="M12 3.5a8.5 8.5 0 0 1 0 17Z" fill="currentColor" stroke="none" />
            </svg>
          </button>
          <button id="btn-relayout" class="icon-btn" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1" />
              <path d="M20.8 4.4v4.2h-4.2" />
            </svg>
          </button>
          <button id="btn-fit" class="icon-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9V5.5a1 1 0 0 1 1-1h3.5" />
              <path d="M15.5 4.5H19a1 1 0 0 1 1 1V9" />
              <path d="M20 15v3.5a1 1 0 0 1-1 1h-3.5" />
              <path d="M8.5 19.5H5a1 1 0 0 1-1-1V15" />
              <circle cx="12" cy="12" r="2.4" />
            </svg>
          </button>
          <!-- Шестерёнка нужна и на стартовой карточке: значок один
               (src/ui/icons.ts), сюда его ставит initApp при старте. -->
          <button id="btn-settings" class="icon-btn"></button>
          <!-- Собственный значок «выход»: дверной проём и стрелка наружу.
               Знака-символа с таким смыслом в юникоде нет, а эмодзи-дверь
               рисуется цветной и выбивается из монохромного ряда. -->
          <button id="btn-new" class="icon-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M13 4H5.5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1H13" />
              <path d="M17 12H10" />
              <path d="M14.5 9 17.5 12l-3 3" />
            </svg>
          </button>
        </div>
      </header>
      <section id="hand-top" class="hand"></section>
      <main id="table">
        <svg id="board"></svg>
        <div id="boneyard"></div>
        <div id="tutor-bar" hidden></div>
        <div id="confirm-bar" hidden></div>
        <div id="history-bar" hidden></div>
        <div id="toast" hidden></div>
      </main>
      <section id="hand-bottom" class="hand"></section>
      <div id="overlay" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script data-goatcounter="https://dofodo.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  </body>
</html>
